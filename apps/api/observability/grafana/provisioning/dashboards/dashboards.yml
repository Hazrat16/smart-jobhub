apiVersion: 1

providers:
  - name: smart-jobhub
    folder: Smart JobHub
    type: file
    # Dashboards live in the repo; edits made in the UI are lost on restart.
    # To change one, edit it in Grafana, export the JSON and commit it here.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
