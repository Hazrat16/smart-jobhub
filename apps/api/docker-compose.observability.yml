# Local observability stack, layered on top of the dev stack:
#   docker compose -f docker-compose.dev.yml -f docker-compose.observability.yml up --build
#
#   Grafana     http://localhost:3001  (admin / admin, or GRAFANA_ADMIN_PASSWORD)
#   Prometheus  http://localhost:9090  (targets: Status > Targets, alerts: Alerts)
#   Alloy UI    http://localhost:12345 (log pipeline health)
#
# Metrics: Prometheus scrapes the API's /metrics plus the Redis and MongoDB exporters.
# Logs:    Alloy tails the Docker logs of containers labelled smartjobhub.logs=true
#          and pushes them to Loki. Grafana reads both. See docs/observability.md.
services:
  # Label the dev-stack services whose logs Alloy should collect.
  job-platform-api:
    labels:
      smartjobhub.logs: "true"
  mongo:
    labels:
      smartjobhub.logs: "true"
  redis:
    labels:
      smartjobhub.logs: "true"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus-dev
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle # POST /-/reload after editing the config
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - job-platform-api

  loki:
    image: grafana/loki:3.5.3
    container_name: loki-dev
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: alloy-dev
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only is enough to list containers and read their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana-dev
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api-overview.json
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  redis-exporter:
    image: oliver006/redis_exporter:v1.75.0
    container_name: redis-exporter-dev
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis

  mongodb-exporter:
    image: percona/mongodb_exporter:0.47.1
    container_name: mongodb-exporter-dev
    command:
      - --mongodb.uri=mongodb://mongo:27017
      - --collect-all
      - --compatible-mode # also emit the classic mongodb_up / mongodb_connections names
    depends_on:
      - mongo

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
