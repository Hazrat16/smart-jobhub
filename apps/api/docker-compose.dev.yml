# Local dev stack: API with hot reload + MongoDB + Redis.
#   docker compose -f docker-compose.dev.yml up --build
# Values from .env (if present) are used for ${...} below and for other keys via env_file.
services:
  job-platform-api:
    container_name: job-platform-api-dev
    image: job-platform-api:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/job-platform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7.0
    container_name: mongo-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    # BullMQ needs noeviction: an evicted job key would silently lose an email.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"

volumes:
  mongo-data:
