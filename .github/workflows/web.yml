name: web

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filtering happens here instead of in `on.paths`, so the required
  # `web-ci` check always reports a result and never blocks unrelated PRs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      onboarding: ${{ steps.filter.outputs.onboarding }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/web.yml'
            # Sign-up/sign-in spans both apps, so either one can break it.
            onboarding:
              - 'apps/web/**'
              - 'apps/api/**'
              - '.github/workflows/web.yml'

  build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e-smoke:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E
        run: npm run test:e2e:smoke

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  image:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t job-platform-web:${{ github.sha }} apps/web

      # Trivy runs from its pinned image rather than aquasecurity/trivy-action,
      # whose tags were hijacked in a 2026 supply-chain attack.
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          job-platform-web:${{ github.sha }}

  # Real sign-up and sign-in in a browser, against the real API and MongoDB.
  e2e-onboarding:
    needs: changes
    if: needs.changes.outputs.onboarding == 'true'
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/e2e
      E2E_DEMO_PASSWORD: e2e-demo-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Build the API and seed demo data
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          DEMO_PASSWORD="$E2E_DEMO_PASSWORD" SEED_DEMO_CONFIRM=yes node dist/scripts/seedDemo.js

      - name: Start the API
        working-directory: apps/api
        env:
          PORT: "5000"
          NODE_ENV: development
          JWT_SECRET: ci-e2e-jwt-secret-at-least-32-characters
          RESEND_API_KEY: re_ci_dummy
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
        run: |
          nohup node dist/startChatServer.js > api.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/api/health/ready > /dev/null && exit 0
            sleep 2
          done
          cat api.log; exit 1

      - name: Install the web app and browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Onboarding E2E
        working-directory: apps/web
        run: npx playwright test tests/e2e/onboarding.spec.js

      - name: API log
        if: failure()
        run: tail -100 apps/api/api.log

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-results
          path: apps/web/test-results
          retention-days: 7

  # Single required status check for branch protection.
  web-ci:
    needs: [changes, build, e2e-smoke, e2e-onboarding, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "web CI passed or was not needed"
