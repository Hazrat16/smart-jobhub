name: Show OIDC claims
description: >-
  Prints the claims of this job's GitHub OIDC token (never the token itself), so a failed
  "Not authorized to perform sts:AssumeRoleWithWebIdentity" shows what the AWS role must trust.
  Needs `id-token: write`.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
        payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
        while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
        echo "The AWS role's trust policy must match this 'sub' (see infra/bootstrap):"
        echo "$payload" | base64 -d | jq '{sub, job_workflow_ref, repository, repository_id, repository_owner_id, ref, environment}'
